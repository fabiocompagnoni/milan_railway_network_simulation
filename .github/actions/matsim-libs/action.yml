name: MATSim snapshot dependencies
description: >
  Provides matsim and railsim 2027.0-SNAPSHOT in the local Maven repository.
  They are not published anywhere, so they are built once from the pinned
  matsim-libs commit and cached; the cache is shared by every job and runner
  OS, because the artifacts are plain jars.
inputs:
  commit:
    description: The matsim-libs commit to build
    required: true
runs:
  using: composite
  steps:
    # The cache stores paths relative to the workspace. The home directory is
    # on another drive on Windows, so a cache of ~/.m2 saved on Linux is
    # restored there to the wrong place: the artifacts are cached from a
    # folder of the workspace and copied to and from the Maven repository.
    - name: Restore the MATSim artifacts
      id: cache
      uses: actions/cache@v4
      with:
        path: .matsim-repository
        key: matsim-repository-${{ inputs.commit }}
        enableCrossOsArchive: true

    - name: Fetch the pinned matsim-libs commit
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git init matsim-libs
        cd matsim-libs
        git fetch --depth 1 https://github.com/matsim-org/matsim-libs.git "${{ inputs.commit }}"
        git checkout FETCH_HEAD

    - name: Build railsim and its MATSim modules
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: matsim-libs
      run: mvn -B -ntp -DskipTests -Dmaven.javadoc.skip=true install -pl contribs/railsim -am

    - name: Copy the built artifacts to the cached folder
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p .matsim-repository/org .matsim-repository/ch
        cp -r ~/.m2/repository/org/matsim .matsim-repository/org/
        cp -r ~/.m2/repository/ch/sbb .matsim-repository/ch/

    - name: Copy the restored artifacts to the Maven repository
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      run: |
        mkdir -p ~/.m2/repository
        cp -r .matsim-repository/. ~/.m2/repository/
