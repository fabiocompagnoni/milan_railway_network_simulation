name: CI

on:
  push:
    branches: ['**']
  pull_request:

# a newer push on the same branch supersedes the running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MATSIM_LIBS_COMMIT: 31f4e54e39b94e3e01e348c99207618145174596

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: pom.xml

      - uses: ./.github/actions/matsim-libs
        with:
          commit: ${{ env.MATSIM_LIBS_COMMIT }}

      - name: Test
        run: mvn -B -ntp test

      - name: Keep the test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7
